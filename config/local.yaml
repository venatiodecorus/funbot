home_network: "localnet"
command_prefix: "!"

auth:
  nick: "admin"
  # Ergo typically assigns this hostname for local/docker connections.
  # If auth fails, check the debug log for the actual hostname
  # in the "unauthorized command attempt" message and update this value.
  hostname: "localhost"

networks:
  localnet:
    servers:
      - "localhost:6667"
    ssl: false
    nick_prefix: "funbot"
    channels:
      - "#control"
    flood_delay_ms: 200

proxies:
  file: ""

art:
  repo_url: ""
  local_path: ""
  update_interval: "1h"

logging:
  level: "debug"
  format: "text"
