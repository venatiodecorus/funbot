home_network: "homenet"
command_prefix: "!"

auth:
  nick: "myname"
  hostname: "my.host.mask"

networks:
  homenet:
    servers:
      - "irc.home.net:6697"
    ssl: true
    nick_prefix: "funbot"
    channels:
      - "#control"
    flood_delay_ms: 500

proxies:
  file: ""

art:
  repo_url: "https://github.com/birdneststream/asciiart.git"
  local_path: "/data/asciiart"
  update_interval: "1h"

logging:
  level: "info"
  format: "json"
