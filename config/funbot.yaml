home_network: "homenet"
command_prefix: "!"

auth:
  nick: "myname"
  hostname: "my.host.mask"

networks:
  homenet:
    servers:
      - "irc.home.net:6697"
    ssl: true
    nick_prefix: "funbot"       # Legacy: used if nick block is absent
    nick:                        # Nick generation config (overrides nick_prefix)
      strategy: "prefix"        # "prefix", "random", or "wordlist"
      prefix: "funbot"          # Prefix for prefix/random strategies, optional for wordlist
      length: 9                 # Max nick length (for random/wordlist strategies)
      # wordlist_path: ""       # Custom wordlist file; empty = use built-in default
    channels:
      - "#control"
    flood_delay_ms: 500

proxies:
  source: "api"            # "api" (proxy-scanner API) or "rotating" (single rotating SOCKS5 endpoint)
  max_retries: 3           # consecutive failures before purging/rotating

  # --- API source settings (used when source: "api") ---
  api_url: "http://localhost:8080"
  protocol: "socks5"
  max_latency: 1000
  refresh_interval: "5m"
  min_pool_size: 0         # minimum healthy proxies to maintain (0 = on-demand only)

  # --- Rotating proxy settings (used when source: "rotating") ---
  # A single SOCKS5 endpoint that assigns a different exit IP per connection.
  # rotating_addr: "gate.proxycheap.com:10000"
  # rotating_user: "your_username"
  # rotating_pass: "your_password"

art:
  repo_url: "https://github.com/birdneststream/asciiart.git"
  local_path: "/data/asciiart"
  update_interval: "1h"

logging:
  level: "info"
  format: "json"
