home_network: "homenet"
command_prefix: "!"

auth:
  nick: "myname"
  hostname: "my.host.mask"

networks:
  homenet:
    servers:
      - "irc.home.net:6697"
    ssl: true
    nick_prefix: "funbot"
    channels:
      - "#control"
    flood_delay_ms: 500

proxies:
  api_url: "http://localhost:8080"
  protocol: "socks5"
  max_latency: 1000
  refresh_interval: "5m"
  max_retries: 3        # consecutive failures before purging a proxy from pool
  min_pool_size: 0       # minimum healthy proxies to maintain (0 = on-demand only)

art:
  repo_url: "https://github.com/birdneststream/asciiart.git"
  local_path: "/data/asciiart"
  update_interval: "1h"

logging:
  level: "info"
  format: "json"
