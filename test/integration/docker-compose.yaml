# Integration test environment: ergo IRC server
# Usage: docker compose -f test/integration/docker-compose.yaml up -d
services:
  ircd:
    image: ghcr.io/ergochat/ergo:stable
    ports:
      - "6667:6667"
    volumes:
      - ./ergo.yaml:/ircd/ircd.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 6667 || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 10
