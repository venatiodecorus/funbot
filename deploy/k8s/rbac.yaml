apiVersion: v1
kind: ServiceAccount
metadata:
  name: funbot-controller
  namespace: funbot
  labels:
    app: funbot
    component: controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: funbot-controller
  namespace: funbot
  labels:
    app: funbot
    component: controller
rules:
  # Manage worker Deployments (scale, create for runtime networks)
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "update", "patch"]
  # Check pod readiness
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: funbot-controller
  namespace: funbot
  labels:
    app: funbot
    component: controller
subjects:
  - kind: ServiceAccount
    name: funbot-controller
    namespace: funbot
roleRef:
  kind: Role
  name: funbot-controller
  apiGroup: rbac.authorization.k8s.io
